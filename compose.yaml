services:
  app:
    build: .
    ports:
      - "127.0.0.1:8088:8000"
    environment:
      APP_ENV: local
      APP_DEBUG: "false"
      APP_URL: http://localhost:8088
      DB_CONNECTION: sqlite
      DB_DATABASE: /app/storage/database/database.sqlite
      MAIL_MAILER: log
      DEMO_SEED: "true"
    volumes:
      - kod_storage:/app/storage
volumes:
  kod_storage:
